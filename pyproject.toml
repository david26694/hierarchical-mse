[project]
name = "hierarchical-mse"
version = "0.1.0"
description = "A regression loss for grouped data that up-weights between-group error, with gradients, Hessians and a LightGBM objective."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David Masip", email = "david26694@gmail.com" }]
keywords = [
    "machine-learning",
    "gradient-boosting",
    "lightgbm",
    "loss-function",
    "grouped-data",
    "hierarchical",
    "clustered",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
lightgbm = ["lightgbm>=4.0"]

[project.urls]
Homepage = "https://github.com/david26694/hierarchical-mse"
Repository = "https://github.com/david26694/hierarchical-mse"
Issues = "https://github.com/david26694/hierarchical-mse/issues"

[dependency-groups]
dev = ["pytest>=7.0", "ruff>=0.7", "scikit-learn>=1.0", "lightgbm>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hierarchical_mse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
